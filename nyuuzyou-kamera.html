<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔥 火の国サラマンダーズ 入場受付</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

  <h1>🔥 火の国サラマンダーズ 入場受付</h1>

  <div id="preview-container">
    <div id="preview"></div>
  </div>

  <button id="start-btn" class="start-btn" onclick="startCamera()">📷 カメラを起動する</button>
  <p id="err-msg" style="color:#ff5252; margin-top:10px; font-size:0.9rem;"></p>

  <!-- 判定結果画面 -->
  <div id="result-screen">
    <div id="res-title" class="res-title">---</div>
    <div id="res-subtitle" class="res-subtitle">---</div>
    <div id="info-box" class="info-box"></div>
  </div>


        <div class="info-item"><span class="info-label">チケットNo:</span><span class="info-value">${res.ticketNo}</span></div>
        <div class="info-item"><span class="info-label">種類:</span><span class="info-value">${res.ticketType}</span></div>
        <div class="info-item"><span class="info-label">入場時刻:</span><span class="info-value">${res.time}</span></div>
        <div class="info-item"><span class="info-label">チケットNo:</span><span class="info-value">${res.ticketNo}</span></div>
        <div class="info-item"><span class="info-label">種類:</span><span class="info-value">${res.ticketType}</span></div>
        <div class="info-item"><span class="info-label">初回入場:</span><span class="info-value">${res.firstTime}</span></div>
        <div class="info-item"><span class="info-label">今回入場:</span><span class="info-value">${res.currentTime}</span></div>
        <div class="info-item"><span class="info-label">再入場回数:</span><span class="info-value">${res.count} 回目</span></div>
        <div class="info-item"><span class="info-label">チケットNo:</span><span class="info-value">${res.ticketNo}</span></div>
        <div class="info-item"><span class="info-label">使用日:</span><span class="info-value">${res.firstDate}</span></div>
    <div style="text-align:center;">${res.message}</div>
</script>
</body>
</html>
