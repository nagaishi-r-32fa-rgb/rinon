<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔥 火の国サラマンダーズ 入場受付</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      padding: 15px;
    }
    h1 { font-size: 1.3rem; margin-bottom: 15px; color: #ff5252; letter-spacing: 1px; }
    
    #preview-container {
      width: 100%;
      max-width: 420px;
      margin: 0 auto;
      background: #1e1e1e;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    #preview {
      width: 100%;
      border-radius: 8px;
      overflow: hidden;
      background: #000;
    }

    .start-btn {
      width: 100%;
      max-width: 420px;
      padding: 15px;
      font-size: 1.2rem;
      font-weight: bold;
      background-color: #ff5252;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 4px 12px rgba(255,82,82,0.4);
    }

    /* 判定結果画面（オーバーレイ） */
    #result-screen {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 9999;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    
    .bg-first { background-color: #2e7d32 !important; } /* 緑：初回OK */
    .bg-reentry { background-color: #0288d1 !important; } /* 青：再入場OK */
    .bg-denied { background-color: #d32f2f !important; } /* 赤：入場不可 */
    .bg-invalid { background-color: #ed6c02 !important; } /* オレンジ：無効 */
    .bg-error { background-color: #616161 !important; } /* 灰：通信エラー */

    .res-title { font-size: 3.5rem; font-weight: 900; margin-bottom: 10px; text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
    .res-subtitle { font-size: 2rem; font-weight: bold; margin-bottom: 25px; opacity: 0.9; }
    
    .info-box {
      background: rgba(0, 0, 0, 0.4);
      border-radius: 12px;
      padding: 20px;
      width: 90%;
      max-width: 420px;
      text-align: left;
      font-size: 1.2rem;
      line-height: 1.8;
    }
    .info-item { display: flex; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.2); padding: 6px 0; }
    .info-item:last-child { border-bottom: none; }
    .info-label { opacity: 0.8; }
    .info-value { font-weight: bold; }
  </style>
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

  <h1>🔥 火の国サラマンダーズ 入場受付</h1>

  <div id="preview-container">
    <div id="preview"></div>
  </div>

  <button id="start-btn" class="start-btn" onclick="startCamera()">📷 カメラを起動する</button>
  <p id="err-msg" style="color:#ff5252; margin-top:10px; font-size:0.9rem;"></p>

  <!-- 判定結果画面 -->
  <div id="result-screen">
    <div id="res-title" class="res-title">---</div>
    <div id="res-subtitle" class="res-subtitle">---</div>
    <div id="info-box" class="info-box"></div>
  </div>

<script>
  // ★ここに取得したGASのデプロイURLを貼り付けてください
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxLLDHKNPPFQnp1Vpxo_T9tboahamyMtzD9nj5FWfom33i8rex5mdbGpuFG_SnCUdDxMw/exec";

  let html5QrCode = null;
  let isProcessing = false;

  async function startCamera() {
    document.getElementById('err-msg').innerText = "";
    
    if (!html5QrCode) {
      html5QrCode = new Html5Qrcode("preview");
    }

    const config = { fps: 15, qrbox: { width: 250, height: 250 } };

    try {
      // 背面カメラを優先して直接起動
      await html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);
      document.getElementById('start-btn').style.display = 'none';
    } catch (err) {
      try {
        // インカメラ等で再試行
        await html5QrCode.start({ facingMode: "user" }, config, onScanSuccess);
        document.getElementById('start-btn').style.display = 'none';
      } catch (e) {
        document.getElementById('err-msg').innerText = "カメラの起動に失敗しました。ブラウザの設定でカメラを許可してください。";
      }
    }
  }

  function onScanSuccess(decodedText) {
    if (isProcessing) return;
    isProcessing = true;

    playBeep();
    showResult('bg-error', '照合中...', 'チケット情報を確認しています', '');

    // GAS API へデータ送信
    fetch(GAS_API_URL, {
      method: "POST",
      body: JSON.stringify({ ticketId: decodedText }),
      headers: { "Content-Type": "text/plain;charset=utf-8" }
    })
    .then(res => res.json())
    .then(data => handleResult(data))
    .catch(err => handleError(err));
  }

  function handleResult(res) {
    let bgClass = 'bg-error';
    let html = '';

    if (res.status === 'FIRST_ENTRY') {
      bgClass = 'bg-first';
      html = `
        <div class="info-item"><span class="info-label">チケットNo:</span><span class="info-value">${res.ticketNo}</span></div>
        <div class="info-item"><span class="info-label">種類:</span><span class="info-value">${res.ticketType}</span></div>
        <div class="info-item"><span class="info-label">入場時刻:</span><span class="info-value">${res.time}</span></div>
      `;
    } else if (res.status === 'RE_ENTRY') {
      bgClass = 'bg-reentry';
      html = `
        <div class="info-item"><span class="info-label">チケットNo:</span><span class="info-value">${res.ticketNo}</span></div>
        <div class="info-item"><span class="info-label">種類:</span><span class="info-value">${res.ticketType}</span></div>
        <div class="info-item"><span class="info-label">初回入場:</span><span class="info-value">${res.firstTime}</span></div>
        <div class="info-item"><span class="info-label">今回入場:</span><span class="info-value">${res.currentTime}</span></div>
        <div class="info-item"><span class="info-label">再入場回数:</span><span class="info-value">${res.count} 回目</span></div>
      `;
    } else if (res.status === 'DENIED') {
      bgClass = 'bg-denied';
      html = `
        <div class="info-item"><span class="info-label">チケットNo:</span><span class="info-value">${res.ticketNo}</span></div>
        <div class="info-item"><span class="info-label">使用日:</span><span class="info-value">${res.firstDate}</span></div>
      `;
    } else {
      bgClass = 'bg-invalid';
      html = `<div style="text-align:center;">${res.message}</div>`;
    }

    showResult(bgClass, res.title, res.subtitle || '', html);
    setTimeout(resetScanner, 2500);
  }

  function handleError(err) {
    showResult('bg-error', '通信エラー', '接続を確認してください', err.toString());
    setTimeout(resetScanner, 3000);
  }

  function showResult(bgClass, title, subtitle, infoHtml) {
    const screen = document.getElementById('result-screen');
    screen.className = bgClass;
    document.getElementById('res-title').innerText = title;
    document.getElementById('res-subtitle').innerText = subtitle;
    document.getElementById('info-box').innerHTML = infoHtml;
    screen.style.display = 'flex';
  }

  function resetScanner() {
    document.getElementById('result-screen').style.display = 'none';
    isProcessing = false;
  }

  function playBeep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.12);
    } catch(e){}
  }
</script>
</body>
</html>
